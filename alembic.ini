# Alembic configuration file
#
# This project keeps the Alembic environment in ./alembic.
# The actual database URL is overridden in alembic/env.py from opponent_adjusted.config.settings.

[alembic]
script_location = alembic

# This is a placeholder; env.py replaces it.
sqlalchemy.url = sqlite:///data/opponent_adjusted.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
