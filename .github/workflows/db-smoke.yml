name: Database Smoke

on:
  pull_request:
    paths:
      - 'alembic/**'
      - 'src/opponent_adjusted/db/**'
      - 'scripts/ingest_*.py'
      - 'scripts/normalize_events.py'
      - 'docker-compose.yml'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/db-smoke.yml'
  push:
    branches: [main]

jobs:
  postgres-smoke:
    name: Postgres migration smoke
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: opponent_metrics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d opponent_metrics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/opponent_metrics
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: opponent_metrics

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: '1.8.3'

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Run migrations
        run: poetry run alembic upgrade head

      - name: Verify database connection
        run: |
          poetry run python - <<'PY'
          from sqlalchemy import text
          from opponent_adjusted.db.session import engine

          with engine.connect() as conn:
              result = conn.execute(text('select 1')).scalar_one()
              assert result == 1
          print('database smoke check passed')
          PY
