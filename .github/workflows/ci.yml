name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: Lint, type check and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: '1.8.3'

      - name: Configure Poetry
        run: poetry config virtualenvs.create true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock', 'pyproject.toml') }}
          restore-keys: |
            poetry-${{ runner.os }}-

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Ruff check
        run: poetry run ruff check src scripts tests

      - name: Black check
        run: poetry run black --check src scripts tests

      # MyPy is intentionally scoped while the full-repo typing backlog is paid down.
      # Ruff and Black still run across the full repo.
      - name: MyPy
        run: >
          poetry run mypy
          src/opponent_adjusted/api/schemas.py
          src/opponent_adjusted/features/cxg/context.py
          src/opponent_adjusted/features/cxg/geometry.py
          src/opponent_adjusted/features/context.py
          src/opponent_adjusted/features/geometry.py

      # Normal CI runs deterministic non-E2E tests. Data-dependent E2E tests
      # require fixture/data setup and are covered by Database Smoke or future hardening.
      - name: Pytest
        run: poetry run pytest -v -m "not e2e"
