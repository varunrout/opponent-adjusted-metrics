name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: Tests and quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pipx install poetry

      - name: Configure Poetry cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock', 'pyproject.toml') }}
          restore-keys: |
            poetry-${{ runner.os }}-

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Check formatting
        run: poetry run black --check src/ scripts/ tests/

      - name: Lint
        run: poetry run ruff check src/ scripts/ tests/

      - name: Type check
        run: poetry run mypy src/

      - name: Run tests
        env:
          DATABASE_BACKEND: sqlite
          DATABASE_URL: sqlite:///data/opponent_adjusted.db
          STATSBOMB_DATA_PATH: ./tests/fixtures/statsbomb
        run: poetry run pytest -v
