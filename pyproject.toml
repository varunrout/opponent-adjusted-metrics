[tool.poetry]
name = "opponent-adjusted-metrics"
version = "1.0.0"
description = "End-to-end contextual, opponent-adjusted football metrics using StatsBomb Open Data"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "opponent_adjusted", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pyarrow = "^15.0.0"
google-cloud-storage = "^2.18.2"
google-cloud-bigquery = "^3.31.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.1.0"
ruff = "^0.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
